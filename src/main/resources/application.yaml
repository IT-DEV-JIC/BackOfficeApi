server:
  error:
    include-stacktrace: never

  compression:
    enabled: true
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/xml
      - text/plain
    min-response-size: 1024

  servlet:
    multipart:
      enabled: true
      max-file-size: 1024MB
      max-request-size: 1024MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  tomcat:
    threads:
      max: 200
      min-spare: 50
    max-connections: 10000
    accept-count: 200
    connection-timeout: 20000ms
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB
    background-processor-delay: 30s

spring:
  profiles:
    active: dev

  application:
    name: JicBackOfficePortal

  devtools:
    restart:
      enabled: false

  ai:
    ollama:
      base-url: http://10.0.41.141:11434
      chat:
        model: qwen3:32b

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@//10.0.41.141:1521/ORCL.JIC.LOCAL
    username: ENC(0SMFLl+A81CLd3GlM+w7ToILCeTBz3y2NnUjdV7zhYPs5mhPpBtSW4FCC+8WcFvd)
    password: ENC(ceFKslXn0nb1j5dSpVKYiA9AP4CoH3+VUZFDJ2uugf/xguk8b9vQQpNnRpZcH39K)
    hikari:
      connection-timeout: 200000
      maximum-pool-size: 100
      minimum-idle: 5
      idle-timeout: 3000000
      max-lifetime: 1200000
      connection-test-query: SELECT 1 FROM DUAL
      data-source-properties:
        oracle.jdbc.ReadTimeout: 600000
        oracle.jdbc.ConnectTimeout: 300000

  jdbc:
    core:
      JdbcTemplate:
        methods:
          - translateException
          - execute
          - call

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mvc:
    async:
      request-timeout: 300000

  servlet:
    multipart:
      enabled: true
      max-file-size: 1024MB
      max-request-size: 1024MB

  session:
    store-type: redis

  data:
    redis:
      host: banca.jicjo.com
      port: 6379

jasypt:
  encryptor:
    algorithm: PBEWITHHMACSHA512ANDAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator

